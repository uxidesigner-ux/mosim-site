<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="report.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">후기 남기기</h1><span></span></header>
<main class="page">
  <div class="row"><span class="thumb"><img src="../assets/photos/helper-jeongmi.jpg" alt="도우미 이정미"></span>
    <div class="row-main"><p class="row-title">이정미 님</p><p class="row-sub">11월 5일(목) 동행</p></div></div>
  <div class="field"><span class="label">별점</span>
    <div class="rating is-input" role="radiogroup" aria-label="별점">
      <button class="is-on" role="radio" aria-checked="false" aria-label="1점"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg></button>
      <button class="is-on" role="radio" aria-checked="false" aria-label="2점"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg></button>
      <button class="is-on" role="radio" aria-checked="false" aria-label="3점"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg></button>
      <button class="is-on" role="radio" aria-checked="false" aria-label="4점"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg></button>
      <button class="is-on" role="radio" aria-checked="true" aria-label="5점"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.9z"/></svg></button>
    </div>
  </div>
  <div class="field is-error"><label class="label" for="pub">공개 후기</label>
    <textarea class="input" id="pub" rows="4" aria-invalid="true">상계동 ○○아파트 앞에서 만나 접수부터 약국까지 꼼꼼히 챙겨 주셨어요.</textarea>
    <p class="field-msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17.2v.1"/></svg>공개 후기에는 주소·건강 정보를 쓸 수 없어요</p>
  </div>
  <div class="field"><label class="label" for="ops">운영팀에만 전하기 (선택 · 비공개)</label>
    <textarea class="input" id="ops" rows="3" placeholder="불편했던 점은 여기에만 적어 주세요"></textarea>
  </div>
  <a class="row" href="request-new.html"><span class="row-art is-line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12.5" rx="2"/><path d="M3.5 7l8.5 6 8.5-6"/></svg></span>
    <div class="row-main"><p class="row-title">같은 분께 다시 부탁하기</p><p class="row-sub">새 요청으로 이어져요</p></div><span class="row-trail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></span></a>
</main>
<div class="cta"><a class="btn primary full" href="review--done.html">후기 올리기</a></div>
