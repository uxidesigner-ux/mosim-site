<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=375, initial-scale=1">
<title>도우미 가입 · 서류 · 오류</title>
<link id="tokens" rel="stylesheet" href="../tokens.css"><link rel="stylesheet" href="../components.css"><script src="../palette.js"></script>
</head>
<body class="plain has-cta">
<header class="appbar"><a class="appbar-btn" href="start.html" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></a><h1 class="appbar-title">도우미 가입</h1><span></span></header>
<main class="page">
  <div class="field"><label class="label" for="n">이름</label><input class="input" id="n" value="최현숙"></div>
  <div class="field"><label class="label" for="a">사는 곳</label><input class="input" id="a" value="노원구 중계동"></div>
  <div class="field"><span class="label">서류 — 사진 한 장씩</span>
    <section class="block is-list">
    <div class="row"><span class="row-art is-line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><div class="row-main"><p class="row-title">신분증 사진</p></div><span class="row-trail"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>올렸어요</span></div>
    <div class="field is-error">
      <div class="row"><span class="row-art is-line"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2.5h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span><div class="row-main"><p class="row-title">요양보호사 자격증 사진</p></div><span class="row-trail"><label class="btn small secondary">사진 올리기<input type="file" accept="image/*" hidden></label></span></div>
      <p class="field-msg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4l9 16H3z"/><path d="M12 10v4"/><path d="M12 17.2v.1"/></svg>자격증이 있다고 하셨어요 — 사진을 한 장 올려 주세요</p>
    </div>
    </section>
  </div>
  <div class="field"><span class="label">가능한 도움</span>
    <div class="chips" role="group" aria-label="가능한 도움"><button class="chip is-selected" role="checkbox" aria-checked="true">접수</button><button class="chip is-selected" role="checkbox" aria-checked="true">수납</button><button class="chip is-selected" role="checkbox" aria-checked="true">약국 동행</button></div>
    <div class="chips" role="group" aria-label="가능한 도움 이어서"><button class="chip is-selected" role="checkbox" aria-checked="true">귀가 동행</button><button class="chip" role="checkbox" aria-checked="false">진료실 동석</button></div>
  </div>
  <div class="field"><span class="label">이동</span>
    <div class="chips" role="group" aria-label="이동"><button class="chip is-selected" role="checkbox" aria-checked="true">걷기</button><button class="chip is-selected" role="checkbox" aria-checked="true">대중교통</button><button class="chip" role="checkbox" aria-checked="false">자차</button></div>
  </div>
  <p class="info"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.5v.01"/></svg><span>제출만으로 확인됨이 되지 않아요 — 확인까지 3~5일(예시)</span></p>
</main>
<div class="cta"><a class="btn primary full" href="helper-verify.html">가입 신청하기</a></div>
</body></html>
