<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모심</title>
<meta name="description" content="부모님 병원 가는 날, 동행을 더해요 — 모심 모바일 서비스 미리보기">
<meta name="theme-color" content="#F1F3F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="모심">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/app-icon-192.png">
<link rel="apple-touch-icon" href="assets/app-icon-192.png">
<link id="tokens" rel="stylesheet" href="tokens.css">
<script>
  // 휴대폰에서는 앱처럼 바로 그 화면을 연다 (#home 처럼 화면 id를 붙이면 그 화면부터)
  (function () {
    var id = (location.hash || "").replace(/^#/, "") || "start";
    var phone = matchMedia("(max-width: 600px)").matches || (matchMedia("(pointer: coarse)").matches && Math.min(screen.width, screen.height) < 600);
    if (phone && !/[?&]frame=1/.test(location.search)) location.replace("screens/" + encodeURIComponent(id) + ".html");
  })();
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: var(--c-bg); color: var(--c-text-1); font-family: var(--font); letter-spacing: var(--tracking); -webkit-font-smoothing: antialiased; }
  .wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; gap: 64px; padding: 40px 24px; }
  .side { width: 320px; display: flex; flex-direction: column; gap: 24px; }
  .eyebrow { margin: 0; font-size: var(--fs-caption); font-weight: var(--fw-caption); color: var(--c-text-2); }
  h1 { margin: 4px 0 8px; font-size: 40px; line-height: 1.2; font-weight: 700; }
  .lead { margin: 0; font-size: var(--fs-body); line-height: var(--lh-body); color: var(--c-text-2); }
  .label { margin: 0 0 8px; font-size: var(--fs-sub); font-weight: 600; color: var(--c-text-1); }
  .flows { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
  .flow { width: 100%; min-height: 56px; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 10px 16px; border: 1px solid var(--c-line); border-radius: var(--r-m); background: var(--c-surface); color: inherit; font: inherit; text-align: left; cursor: pointer; }
  .flow strong { font-size: var(--fs-sub); font-weight: 600; }
  .flow span { font-size: var(--fs-caption); color: var(--c-text-2); }
  .flow:hover { border-color: var(--c-line-strong); }
  .flow[aria-current="true"] { border-color: var(--c-brand); background: var(--c-brand-tint); }
  .flow:focus-visible, .link:focus-visible { outline: 2px solid var(--c-focus); outline-offset: 2px; }
  .qr { display: flex; align-items: center; gap: 16px; padding: 16px; border-radius: var(--r-l); background: var(--c-surface); }
  .qr #qr { flex: none; width: 96px; height: 96px; }
  .qr #qr img, .qr #qr canvas { width: 96px !important; height: 96px !important; }
  .qr p { margin: 0; font-size: var(--fs-sub); line-height: var(--lh-sub); color: var(--c-text-2); }
  .link { color: var(--c-brand-text); font-size: var(--fs-sub); font-weight: 600; text-decoration: none; }
  .phone { flex: none; width: 399px; height: 836px; padding: 12px; border-radius: 52px; background: #15191E; box-shadow: var(--shadow-2); }
  .screen { position: relative; width: 375px; height: 812px; border-radius: 40px; overflow: hidden; background: var(--c-surface); }
  .screen iframe { display: block; width: 100%; height: 100%; border: 0; }
  .now { margin: 12px 0 0; text-align: center; font-size: var(--fs-caption); color: var(--c-text-2); }
  .note { margin: 0; font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--c-text-3); }
  @media (max-width: 900px) { .wrap { flex-direction: column-reverse; gap: 32px; } .side { width: min(399px, 100%); } }
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div>
      <p class="eyebrow">모바일 서비스 미리보기</p>
      <h1>모심</h1>
      <p class="lead">부모님 병원 가는 날, 동행을 더해요. 화면 속 버튼을 눌러 앱처럼 넘겨 보세요.</p>
    </div>
    <div>
      <p class="label">누구의 하루부터 볼까요</p>
      <ul class="flows" id="flows"></ul>
    </div>
    <div class="qr">
      <div id="qr" aria-hidden="true"></div>
      <p>휴대폰 카메라로 찍으면 앱처럼 전체 화면으로 열려요.</p>
    </div>
    <a class="link" href="canvas.html">전체 화면 한눈에 보기(디자이너용) ›</a>
    <p class="note">프로토타입입니다. 요금·수수료·취소 규정은 예시값이고, 사진은 AI 생성 이미지예요.</p>
  </aside>
  <div>
    <div class="phone"><div class="screen"><iframe id="app" title="모심 앱 화면" src="screens/start.html"></iframe></div></div>
    <p class="now" id="now" aria-live="polite"></p>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  var FLOWS = [
    ["start", "처음 시작", "부탁하러 왔나, 일하러 왔나"],
    ["home", "보호자 김수진", "부탁부터 확정까지"],
    ["parent-consent", "어머니 박영순", "문자 링크로 동의하고 안내받기"],
    ["notifications", "보호자 · 동행 당일", "알림 5개로 진행 따라가기"],
    ["helper-requests", "도우미 이정미", "지원부터 귀가 기록·정산까지"],
    ["helper-join", "신규 도우미 최현숙", "가입과 서류 확인"],
    ["report", "보호자 · 끝난 뒤", "기록 확인·결제·후기"]
  ];
  var frame = document.getElementById("app"), list = document.getElementById("flows"), now = document.getElementById("now");
  FLOWS.forEach(function (f) {
    var li = document.createElement("li"), b = document.createElement("button");
    b.className = "flow"; b.type = "button"; b.dataset.id = f[0];
    b.innerHTML = "<strong></strong><span></span>"; b.firstChild.textContent = f[1]; b.lastChild.textContent = f[2];
    b.addEventListener("click", function () { go(f[0]); });
    li.appendChild(b); list.appendChild(li);
  });
  function go(id) { frame.src = "screens/" + id + ".html"; }
  function mark() {
    var id = "";
    try { id = frame.contentWindow.location.pathname.split("/").pop().replace(/\.html$/, ""); now.textContent = frame.contentDocument.title; } catch (e) {}
    if (id) history.replaceState(null, "", "#" + id);
    list.querySelectorAll(".flow").forEach(function (b) { b.setAttribute("aria-current", b.dataset.id === id ? "true" : "false"); });
  }
  frame.addEventListener("load", mark);
  var start = (location.hash || "").replace(/^#/, "");
  if (start) go(start);
  try { new QRCode(document.getElementById("qr"), { text: location.href.split("#")[0].split("?")[0], width: 192, height: 192, colorDark: "#1A2128", colorLight: "#FFFFFF" }); } catch (e) { document.querySelector(".qr").hidden = true; }
</script>
</body></html>
